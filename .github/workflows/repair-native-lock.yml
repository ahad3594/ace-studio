name: Repair native dependency lockfile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-native-lock.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore all optional platform records without changing locked versions
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/ace-clean-lock"
          cp package.json package-lock.json "$RUNNER_TEMP/ace-clean-lock/"
          cd "$RUNNER_TEMP/ace-clean-lock"
          npm install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const old = JSON.parse(fs.readFileSync('package-lock.json'));
          const repaired = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ace-clean-lock/package-lock.json'));
          for (const [name, data] of Object.entries(old.packages)) {
            if (repaired.packages[name]?.version !== data.version) throw new Error('Unexpected dependency version change: '+name);
          }
          for (const platform of ['darwin-arm64','darwin-x64','win32-x64-msvc']) {
            for (const name of ['lightningcss-'+platform,'@tailwindcss/oxide-'+platform,'@next/swc-'+platform]) {
              if (!repaired.packages['node_modules/'+name]) throw new Error('Native package still missing: '+name);
            }
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(repaired,null,2)+'\n');
          JS
          git diff --check
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'Restore locked native dependencies for Windows and macOS'
            git push origin HEAD:main
          fi
