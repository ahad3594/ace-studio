name: Repair native dependency lockfile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-native-lock.yml', 'scripts/repair-native-lock.mjs']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore all optional platform records without changing locked versions
        run: |
          set -euo pipefail
          node scripts/repair-native-lock.mjs
          node scripts/repair-native-lock.mjs --check
          git diff --check
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'Restore locked native dependencies for Windows and macOS'
            git push origin HEAD:main
          fi
