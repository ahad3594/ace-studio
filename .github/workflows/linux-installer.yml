name: Build and publish Linux installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Identify and protect the release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'The tag must match package.json.' >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json isDraft > /tmp/ace-release.json 2>/dev/null; then
            if [[ $(python3 -c 'import json; print(json.load(open("/tmp/ace-release.json"))["isDraft"])') == False ]]; then
              echo 'This version is already published. Bump the version for another release.'
              echo 'build=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.version.outputs.build == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.version.outputs.build == 'true'
        with:
          python-version: '3.12'
      - name: Install build and document dependencies
        if: steps.version.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xz-utils desktop-file-utils patchelf libreoffice-writer libreoffice-calc libreoffice-impress ghostscript fonts-dejavu-core xdg-utils
          npm ci
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
      - name: Test application and build production server
        if: steps.version.outputs.build == 'true'
        run: |
          npm test
          npm run test:documents
          npm run typecheck
          npm run build
      - name: Check browser workflows
        if: steps.version.outputs.build == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          PLAYWRIGHT_SERVER_COMMAND: npm run start
          ACE_PYTHON: ${{ github.workspace }}/.venv/bin/python
          ACE_WORKER: ${{ github.workspace }}/worker/documents.py
          ACE_TESSDATA: ${{ github.workspace }}/data/tessdata
      - name: Build self-contained package
        if: steps.version.outputs.build == 'true'
        run: python desktop/build.py --node "$(command -v node)" --python-runtime "$(python -c 'import sys; print(sys.base_prefix)')"
      - name: Install and check the packaged app
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          test "$(dpkg-deb -f "desktop-dist/ACE-Studio_${VERSION}_amd64.deb" Version)" = "$VERSION"
          sudo apt-get install -y "./desktop-dist/ACE-Studio_${VERSION}_amd64.deb"
          python desktop/smoke_test.py /opt/ace-studio
      - name: Create matching source and checksums
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          git archive --format=zip --prefix=ace-studio/ --output="desktop-dist/ACE-Studio_${VERSION}_source.zip" HEAD
          cd desktop-dist
          sha256sum "ACE-Studio_${VERSION}_amd64.deb" "ACE-Studio_${VERSION}_source.zip" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.build == 'true'
        with:
          name: ACE-Studio-${{ steps.version.outputs.number }}-Linux-x64
          path: |
            desktop-dist/*.deb
            desktop-dist/*_source.zip
            desktop-dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish all assets together
        if: steps.version.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "ACE Studio $VERSION" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" "desktop-dist/ACE-Studio_${VERSION}_amd64.deb" "desktop-dist/ACE-Studio_${VERSION}_source.zip" desktop-dist/SHA256SUMS --clobber
          gh release view "$TAG" --json assets > /tmp/ace-assets.json
          python - <<'PY'
          import json, os
          version = os.environ['VERSION']
          required = {f'ACE-Studio_{version}_amd64.deb', f'ACE-Studio_{version}_source.zip', 'SHA256SUMS'}
          assets = json.load(open('/tmp/ace-assets.json'))['assets']
          uploaded = {asset['name'] for asset in assets if asset['size'] > 0}
          assert required <= uploaded, 'Required release assets are missing'
          PY
          gh release edit "$TAG" --draft=false --latest --notes-file RELEASE_NOTES.md
          gh release view "$TAG" --json url,isDraft,assets
